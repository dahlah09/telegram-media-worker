name: youtube-test

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: YouTube URL
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --upgrade \
            yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Test actual YouTube download
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          mkdir -p work

          echo "===== TESTING URL ====="
          echo "$SOURCE_URL"
          echo "======================="

          yt-dlp \
            -v \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web_embedded" \
            --no-playlist \
            --max-filesize 50M \
            --socket-timeout 30 \
            --retries 3 \
            --fragment-retries 3 \
            --restrict-filenames \
            --merge-output-format mp4 \
            -o 'work/%(id)s.%(ext)s' \
            "$SOURCE_URL"

          echo
          echo "===== DOWNLOADED FILE ====="

          find work \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          FILE="$(find work -maxdepth 1 -type f | head -n 1)"

          test -n "$FILE"

          SIZE="$(stat -c%s "$FILE")"

          echo
          echo "File: $FILE"
          echo "Size: $SIZE bytes"

          test "$SIZE" -le 52428800

          echo
          echo "===== DOWNLOAD SUCCESS ====="
