name: youtube-test

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: YouTube URL
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Test YouTube web_embedded
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          yt-dlp \
            -v \
            --skip-download \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web_embedded" \
            "$SOURCE_URL"
