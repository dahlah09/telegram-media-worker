name: media-download

run-name: media-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Source media URL
        required: true
        type: string
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      reply_to_message_id:
        description: Telegram message ID
        required: true
        type: string
      job_id:
        description: Internal job ID
        required: true
        type: string

concurrency:
  group: telegram-media-worker
  cancel-in-progress: false

jobs:
  download-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --upgrade \
            yt-dlp

      - name: Install bgutil PO Token provider
        run: |
          git clone \
            --single-branch \
            --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            bgutil-ytdlp-pot-provider

          cd bgutil-ytdlp-pot-provider/server

          deno install \
            --allow-scripts=npm:canvas \
            --frozen

      - name: Install bgutil yt-dlp plugin
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --upgrade \
            bgutil-ytdlp-pot-provider

      - name: Start bgutil PO Token server
        run: |
          set -euo pipefail

          cd bgutil-ytdlp-pot-provider/server

          nohup deno run \
            --allow-env \
            --allow-net \
            --allow-ffi=. \
            --allow-read=. \
            ../src/main.ts \
            > "$GITHUB_WORKSPACE/bgutil.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/bgutil.pid"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1; then
              echo "bgutil provider is ready"
              exit 0
            fi

            sleep 1
          done

          echo "bgutil provider failed to start"
          cat "$GITHUB_WORKSPACE/bgutil.log"
          exit 1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify yt-dlp providers
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          yt-dlp -v --skip-download "$SOURCE_URL" 2>&1 | tee yt-dlp-debug.log || true

          grep -E \
            "PO Token Providers|bgutil:http" \
            yt-dlp-debug.log || true

          echo "===== bgutil log ====="
          cat bgutil.log || true

      - name: Download media
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          mkdir -p work

          yt-dlp \
            --js-runtimes deno \
            --no-playlist \
            --max-filesize 50M \
            --socket-timeout 30 \
            --retries 3 \
            --fragment-retries 3 \
            --restrict-filenames \
            --merge-output-format mp4 \
            -o 'work/%(id)s.%(ext)s' \
            "$SOURCE_URL"

      - name: Validate downloaded file
        run: |
          set -euo pipefail

          FILE="$(find work -maxdepth 1 -type f | head -n 1)"
          test -n "$FILE"

          SIZE="$(stat -c%s "$FILE")"
          echo "Media size: $SIZE bytes"

          test "$SIZE" -le 52428800

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          REPLY_TO: ${{ inputs.reply_to_message_id }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          FILE="$(find work -maxdepth 1 -type f | head -n 1)"
          mkdir -p result

          curl \
            --fail-with-body \
            --max-time 900 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "reply_to_message_id=${REPLY_TO}" \
            -F "video=@${FILE}" \
            -F "supports_streaming=true" \
            > response.json

          RESPONSE="$(cat response.json)"

          RESPONSE="$RESPONSE" JOB_ID="$JOB_ID" python -c 'import json,os; d=json.loads(os.environ["RESPONSE"]); r=d.get("result") or {}; v=r.get("video") or {}; print(json.dumps({"ok":bool(d.get("ok")),"job_id":os.environ["JOB_ID"],"file_id":v.get("file_id"),"file_unique_id":v.get("file_unique_id"),"message_id":r.get("message_id"),"error":d.get("description")}))' > result/result.json

          cat result/result.json

          test "$(python -c 'import json; print(json.load(open("result/result.json"))["ok"])')" = "True"

      - name: Upload tiny result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result/result.json
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -rf work result response.json
          if [ -f bgutil.pid ]; then
            kill "$(cat bgutil.pid)" 2>/dev/null || true
          fi
